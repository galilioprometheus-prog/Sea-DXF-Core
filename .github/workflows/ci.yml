name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS ARM64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Verify generated schemas
        run: cargo +1.97.1 run --locked -p seacad-schema-gen -- --check
      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace

  native-smoke:
    # Supplemental runners use the Node20 checkout runtime for compatibility.
    name: ${{ matrix.name }} smoke
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify generated schemas
        run: cargo +1.97.1 run --locked -p seacad-schema-gen -- --check
      - name: Check workspace
        run: cargo +1.97.1 check --workspace --all-targets
      - name: Run core smoke tests
        run: cargo +1.97.1 test -p seacad-dxf-core --lib

  additional-native-quality:
    # Supplemental runners use the Node20 checkout runtime for compatibility.
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Windows ARM64
            os: windows-11-arm
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Verify generated schemas
        run: cargo +1.97.1 run --locked -p seacad-schema-gen -- --check
      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace
