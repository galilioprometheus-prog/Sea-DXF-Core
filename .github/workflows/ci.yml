name: CI (self-hosted manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 8
  CARGO_TARGET_DIR: D:\SeaCad\actions-runner-cache\target

jobs:
  quality:
    name: Windows x64 local quality
    runs-on: [self-hosted, Windows, X64, seacad]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify provisioned toolchain
        shell: pwsh
        run: |
          $rustVersion = rustc +1.97.1 --version
          if ($LASTEXITCODE -ne 0 -or -not $rustVersion.StartsWith("rustc 1.97.1 ")) {
            throw "Expected provisioned Rust 1.97.1, observed: $rustVersion"
          }
          cargo +1.97.1 --version
          cargo deny --version
      - name: Check dependency policy
        run: cargo deny --locked check
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Verify generated schemas
        run: cargo +1.97.1 run --locked -p seacad-schema-gen -- --check
      - name: Verify release evidence
        run: cargo +1.97.1 run --locked -p seacad-schema-gen --bin seacad-release-evidence -- --check
      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace --quiet
