name: Native Release Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-artifacts-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: seacad
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: seacad
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: seacad.exe
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: seacad.exe
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: seacad
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            binary: seacad
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify generated schemas
        run: cargo +1.97.1 run --locked -p seacad-schema-gen -- --check
      - name: Verify release evidence
        run: cargo +1.97.1 run --locked -p seacad-schema-gen --bin seacad-release-evidence -- --check
      - name: Test workspace
        run: cargo +1.97.1 test --workspace
      - name: Build native CLI
        run: cargo +1.97.1 build --locked --release --target ${{ matrix.target }} -p seacad-cli --bin seacad
      - name: Prepare artifact root
        run: mkdir dist
      - name: Assemble native artifact
        run: >-
          cargo +1.97.1 run --locked -p seacad-schema-gen
          --bin seacad-release-packager --
          --target "${{ matrix.target }}"
          --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          --output "dist/seacad-dxf-core-0.0.0-${{ matrix.target }}"
          --commit "${{ github.sha }}"
      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seacad-dxf-core-0.0.0-${{ matrix.target }}
          path: dist/seacad-dxf-core-0.0.0-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
